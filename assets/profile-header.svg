<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Hcini Moez — Full-Stack Software Engineer</title>
  <desc id="desc">Custom profile banner for Hcini Moez, a product-focused full-stack software engineer from Tunisia.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B16" />
      <stop offset="0.52" stop-color="#0D1326" />
      <stop offset="1" stop-color="#090D19" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" />
      <stop offset="0.5" stop-color="#818CF8" />
      <stop offset="1" stop-color="#A78BFA" />
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.42" />
      <stop offset="0.52" stop-color="#2563EB" stop-opacity="0.16" />
      <stop offset="1" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#93C5FD" stroke-opacity="0.075" stroke-width="1" />
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect x="1" y="1" width="1198" height="398" rx="26" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="url(#background)" />
    <rect width="1200" height="400" fill="url(#grid)" />
    <circle cx="1010" cy="194" r="285" fill="url(#orb)" />
    <circle cx="1020" cy="198" r="130" fill="none" stroke="#818CF8" stroke-opacity="0.18" />
    <circle cx="1020" cy="198" r="92" fill="none" stroke="#22D3EE" stroke-opacity="0.22" />
    <circle cx="1020" cy="198" r="54" fill="none" stroke="#A78BFA" stroke-opacity="0.35" />

    <path d="M832 90C920 23 1094 35 1165 115" fill="none" stroke="url(#accent)" stroke-opacity="0.45" stroke-width="2" />
    <path d="M852 316C946 374 1102 350 1178 272" fill="none" stroke="url(#accent)" stroke-opacity="0.28" stroke-width="2" />

    <g fill="#22D3EE" filter="url(#glow)">
      <circle cx="843" cy="83" r="4" />
      <circle cx="1162" cy="114" r="4" />
      <circle cx="853" cy="316" r="3" />
    </g>

    <g transform="translate(72 48)">
      <rect width="194" height="34" rx="17" fill="#0B1220" stroke="#22C55E" stroke-opacity="0.48" />
      <circle cx="18" cy="17" r="5" fill="#22C55E" />
      <text x="32" y="22" fill="#D1FAE5" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">OPEN TO WORK</text>
    </g>

    <text x="70" y="170" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="70" font-weight="800" letter-spacing="-2">HCINI MOEZ</text>
    <text x="73" y="216" fill="url(#accent)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="4.6">FULL-STACK SOFTWARE ENGINEER</text>
    <text x="73" y="258" fill="#A9B5CA" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="17">Turning ambitious ideas into production-ready web, mobile &amp; AI products.</text>

    <g transform="translate(72 304)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.05">
      <g>
        <rect width="103" height="34" rx="9" fill="#111A2D" stroke="#22D3EE" stroke-opacity="0.28" />
        <text x="18" y="22" fill="#CFFAFE">FLUTTER</text>
      </g>
      <g transform="translate(115)">
        <rect width="116" height="34" rx="9" fill="#111A2D" stroke="#818CF8" stroke-opacity="0.3" />
        <text x="18" y="22" fill="#E0E7FF">NEXT.JS</text>
      </g>
      <g transform="translate(243)">
        <rect width="70" height="34" rx="9" fill="#111A2D" stroke="#A78BFA" stroke-opacity="0.3" />
        <text x="20" y="22" fill="#EDE9FE">GO</text>
      </g>
      <g transform="translate(325)">
        <rect width="124" height="34" rx="9" fill="#111A2D" stroke="#22D3EE" stroke-opacity="0.28" />
        <text x="17" y="22" fill="#CFFAFE">SUPABASE</text>
      </g>
      <g transform="translate(461)">
        <rect width="134" height="34" rx="9" fill="#111A2D" stroke="#A78BFA" stroke-opacity="0.3" />
        <text x="18" y="22" fill="#EDE9FE">GEMINI AI</text>
      </g>
    </g>

    <g transform="translate(914 116)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M62 19L18 82L62 145" stroke="#22D3EE" stroke-width="9" stroke-opacity="0.92" />
      <path d="M150 19L194 82L150 145" stroke="#A78BFA" stroke-width="9" stroke-opacity="0.92" />
      <path d="M125 0L87 164" stroke="#E2E8F0" stroke-width="8" stroke-opacity="0.82" />
    </g>

    <g transform="translate(900 316)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif">
      <text x="0" y="0" fill="#64748B" font-size="11" font-weight="700" letter-spacing="1.8">TUNISIA</text>
      <circle cx="74" cy="-4" r="2" fill="#475569" />
      <text x="88" y="0" fill="#64748B" font-size="11" font-weight="700" letter-spacing="1.8">BUILD · SHIP · ITERATE</text>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="398" rx="26" fill="none" stroke="url(#accent)" stroke-opacity="0.52" stroke-width="2" />
</svg>

